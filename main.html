<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CV Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">

  <div class="form-card">

    <h2>Help us prepare your first draft</h2>

    <div class="row">
      <input type="text" placeholder="First Name*" id="fName">
      <input type="text" placeholder="Last Name*" id="lName" >
    </div>

    <input type="email" placeholder="Email*" id="email">
    <input type="text" placeholder="Phone Number*" id="num">
    <input type="text" placeholder="Address*" id="address">
    <input type="text" placeholder="Enter Job Title" id="title">

    <textarea placeholder="Summary* (0/600)" maxlength="600" id="summary"></textarea>

    <button onclick="getData()">I'm Done</button>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
