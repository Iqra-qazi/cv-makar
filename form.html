    <h1>CV Builder (Step Form)</h1>

    <!-- STEP 1 -->
    <div class="step active">
        <h3>Personal Information</h3>

        <input id="fullName" placeholder="Full Name">
        <input id="lastName" placeholder="Last Name">
        <input id="emailForm" placeholder="Email">
        <input id="phone" placeholder="Phone">

        <button onclick="nextStep()">Next</button>
    </div>


    <div class="step">
        <h3>Job Details</h3>

        <input id="title" placeholder="Job Title">
        <textarea id="summary" placeholder="Summary"></textarea>

        <button onclick="prevStep()">Previous</button>
        <button onclick="nextStep()">Next</button>
    </div>

    <div class="step">
        <h3>Education & Experience</h3>

        <textarea id="education" placeholder="Education"></textarea>
        <textarea id="experience" placeholder="Experience"></textarea>

        <button onclick="prevStep()">Previous</button>
        <button onclick="nextStep()">Next</button>
    </div>


    <div class="step">
        <h3>Skills & References</h3>

        <textarea id="skills" placeholder="Skills"></textarea>
        <textarea id="references" placeholder="References"></textarea>

        <button onclick="prevStep()">Previous</button>
        <button onclick="saveCV()">Generate CV</button>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
