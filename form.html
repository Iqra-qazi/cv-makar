<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CV Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="step active">
        <h3>Personal Information</h3>

        <input id="fullName" placeholder="Full Name">
        <input id="lastName" placeholder="Last Name">
        <input id="emailForm" placeholder="Email">
        <input id="phone" placeholder="Phone">

        <button onclick="nextStep()">Next</button>
    </div>


    <div class="step">
        <h3>Job Details</h3>

        <input id="title" placeholder="Job Title">
        <textarea id="summary" placeholder="Summary"></textarea>

        <button onclick="prevStep()">Previous</button>
        <button onclick="nextStep()">Next</button>
    </div>

    <div class="step">
        <h3>Education & Experience</h3>

        <textarea id="education" placeholder="Education"></textarea>
        <textarea id="experience" placeholder="Experience"></textarea>

        <button onclick="prevStep()">Previous</button>
        <button onclick="nextStep()">Next</button>
    </div>


    <div class="step">
        <h3>Skills & References</h3>

        <textarea id="skills" placeholder="Skills"></textarea>
        <textarea id="references" placeholder="References"></textarea>

        <button onclick="prevStep()">Previous</button>
        <button onclick="saveCV()">Generate CV</button>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>

</html>
